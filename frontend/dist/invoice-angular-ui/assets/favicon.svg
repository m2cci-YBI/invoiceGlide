<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .bg{fill:#0f172a}
      .fg{fill:#fff}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="64" height="64" rx="12"/>
  <!-- Monogram 'IF' tightly centered to maximize visible size -->
  <g transform="translate(12,12)">
    <rect class="fg" x="8" y="4" width="6" height="32" rx="2"/>
    <rect class="fg" x="22" y="4" width="18" height="6" rx="2"/>
    <rect class="fg" x="22" y="16" width="14" height="6" rx="2"/>
  </g>
</svg>

