<div class="min-h-screen flex">
  <!-- Sidebar -->
  <aside class="w-64 shrink-0 border-r bg-white/90 backdrop-blur sticky top-0 h-screen hidden md:flex md:flex-col p-4">
    <a routerLink="/" class="flex items-center gap-3 mb-6 cursor-pointer select-none">
      <ng-container *ngIf="settingsService.settings.logoDataUrl; else placeholderLogo">
        <img [src]="settingsService.settings.logoDataUrl!" alt="Logo" class="h-9 w-9 rounded-xl object-cover border" />
      </ng-container>
      <ng-template #placeholderLogo>
        <div class="h-9 w-9 rounded-xl bg-slate-900"></div>
      </ng-template>
      <div class="font-semibold text-slate-900">{{ settingsService.settings.legalName || 'InvoiceGlide' }}</div>
    </a>

    <nav class="space-y-4 text-sm" role="navigation" aria-label="Primary">
      <div>
        <div class="px-3 pb-1 text-xs uppercase tracking-wide text-slate-400">Overview</div>
        <a #rlaDash="routerLinkActive" routerLink="/dashboard" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" [attr.aria-current]="rlaDash.isActive ? 'page' : null" class="group relative flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl text-sm text-slate-700 hover:bg-slate-50 hover:text-slate-900 ring-1 ring-transparent hover:ring-slate-200 transition">
          <span class="active-indicator"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 group-hover:text-slate-900">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
            <rect x="14" y="10" width="7" height="11" rx="1.5"></rect>
            <rect x="3" y="12" width="7" height="9" rx="1.5"></rect>
          </svg>
          <span>Dashboard</span>
        </a>
      </div>

      <div>
        <div class="px-3 pb-1 text-xs uppercase tracking-wide text-slate-400">Manage</div>
        <a #rlaInv="routerLinkActive" routerLink="/invoices" routerLinkActive="is-active" [attr.aria-current]="rlaInv.isActive ? 'page' : null" class="group relative flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl text-sm text-slate-700 hover:bg-slate-50 hover:text-slate-900 ring-1 ring-transparent hover:ring-slate-200 transition">
          <span class="active-indicator"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 group-hover:text-slate-900">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span>Invoices</span>
        </a>
        <a #rlaCli="routerLinkActive" routerLink="/clients" routerLinkActive="is-active" [attr.aria-current]="rlaCli.isActive ? 'page' : null" class="group relative flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl text-sm text-slate-700 hover:bg-slate-50 hover:text-slate-900 ring-1 ring-transparent hover:ring-slate-200 transition">
          <span class="active-indicator"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 group-hover:text-slate-900"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Clients</span>
        </a>
        <a #rlaSet="routerLinkActive" routerLink="/settings" routerLinkActive="is-active" [attr.aria-current]="rlaSet.isActive ? 'page' : null" class="group relative flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl text-sm text-slate-700 hover:bg-slate-50 hover:text-slate-900 ring-1 ring-transparent hover:ring-slate-200 transition">
          <span class="active-indicator"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 group-hover:text-slate-900"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 4.3l.06.06c.46.46 1.12.6 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09c0 .66.39 1.26 1 1.51.7.27 1.36.13 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06c-.46.46-.6 1.12-.33 1.82.27.7.13 1.36-.33 1.82V13c.66 0 1.26.39 1.51 1z"/></svg>
          <span>Settings</span>
        </a>
        <a #rlaOnb="routerLinkActive" routerLink="/onboarding" routerLinkActive="is-active" [attr.aria-current]="rlaOnb.isActive ? 'page' : null" class="group relative flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl text-sm text-slate-700 hover:bg-slate-50 hover:text-slate-900 ring-1 ring-transparent hover:ring-slate-200 transition">
          <span class="active-indicator"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 group-hover:text-slate-900">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
            <line x1="4" y1="22" x2="4" y2="15" />
          </svg>
          <span>Onboarding</span>
          <span class="ml-auto inline-flex items-center gap-1 rounded-full border border-amber-200 bg-amber-50 text-amber-800 px-2 py-0.5 text-[11px]">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" class="text-amber-500"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.786 1.402 8.168L12 18.897l-7.336 3.867 1.402-8.168L.132 9.21l8.2-1.192z"/></svg>
            Start here
          </span>
        </a>
      </div>
    </nav>

    <div class="mt-6 px-3">
      <a routerLink="/new-invoice" class="inline-flex items-center gap-2 rounded-lg bg-slate-900 text-white px-3 py-2 text-sm hover:bg-slate-800 transition">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Invoice
      </a>
    </div>
    <!-- Sidebar footer greeting -->
    <div class="mt-auto px-3 pt-4 text-xs text-slate-600">
      <ng-container *ngIf="(auth.user$ | async) as me">
        <div class="rounded-lg border bg-slate-50 px-3 py-2">
          <span class="text-slate-500">Hi,</span>
          <span class="ml-1 font-medium text-slate-800 capitalize text-sm">{{ me.name || me.email }}</span>
        </div>
      </ng-container>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 min-w-0">
    <!-- Top bar (mobile) -->
    <div class="md:hidden border-b bg-white/80 backdrop-blur sticky top-0 z-40">
      <div class="px-4 h-14 flex items-center justify-between">
        <a routerLink="/" class="flex items-center gap-2">
          <ng-container *ngIf="settingsService.settings.logoDataUrl; else mobilePlaceholderLogo">
            <img [src]="settingsService.settings.logoDataUrl!" alt="Logo" class="h-6 w-6 rounded-lg object-cover border" />
          </ng-container>
          <ng-template #mobilePlaceholderLogo>
            <div class="h-6 w-6 rounded-lg bg-slate-900"></div>
          </ng-template>
          <div class="font-semibold">{{ settingsService.settings.legalName || 'InvoiceGlide' }}</div>
        </a>
        <!-- Add dynamic route title here -->
      </div>
    </div>
    <div class="px-4 sm:px-6 lg:px-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<!-- Global toasts -->
<app-toast-container></app-toast-container>
