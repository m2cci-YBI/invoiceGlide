
<app-page-header
  title="Mail settings"
  subtitle="Preview and test the email templates used for invoices and reminders."
></app-page-header>

<div class="mt-6 card">
  <div class="section-title">Mail template</div>
  <div class="mt-3 grid gap-3 text-sm">
    <select class="select" [ngModel]="selectedTemplateId" (ngModelChange)="onSelectedTemplateIdChange($event)">
      <option *ngFor="let t of templates" [value]="t.id">{{t.id}}: {{t.name}}</option>
    </select>
    <div class="mt-3 p-4 border rounded-xl bg-gray-50">
      <div class="mb-3 text-sm">
        <div><span class="text-gray-500">From:</span> {{settings.supportEmail || 'invoices@invoiceglide.com'}}</div>
        <div><span class="text-gray-500">To:</span> {{'client@example.com'}}</div>
        <div><span class="text-gray-500">Subject:</span> {{renderedSubject}}</div>
      </div>
      <div [innerHTML]="sanitizedBodyCached"></div>
    </div>
    <div class="mt-2"><button class="btn-ghost" (click)="sendTest()">Send test</button></div>
  </div>
</div>
