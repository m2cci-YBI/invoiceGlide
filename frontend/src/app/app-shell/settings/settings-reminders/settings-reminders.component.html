
<div class="mt-6 card">
  <div class="section-title">Reminders schedule</div>
  <div class="mt-3 space-y-2 text-sm">
    <div *ngFor="let r of reminders; let i = index" class="flex items-center justify-between rounded-xl border px-3 py-2">
      <div class="flex items-center gap-3">
        <input type="checkbox" class="accent-black" [(ngModel)]="r.enabled" />
        <div>{{ r.label }}</div>
      </div>
      <div class="text-xs text-gray-600">{{ r.days }} days</div>
    </div>
    <div>
      <button class="btn-ghost mt-2" (click)="save()">Save reminders</button>
    </div>
  </div>
</div>
