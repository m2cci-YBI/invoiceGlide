
  <div class="flex items-start justify-between">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Invoice settings</h1>
      <p class="mt-1 text-sm text-gray-600">Branding, formats, and defaults.</p>
    </div>
    <div class="flex items-center gap-2">
      <button (click)="saveTemplateSettings()" class="btn-primary">Save</button>
      <button (click)="openPreview()" class="btn-ghost">Preview invoice</button>
    </div>
  </div>

    <div class="mt-6 space-y-6">
    <div class="card">
      <div class="section-title">Company profile</div>
      <div class="mt-3 grid sm:grid-cols-2 gap-3 text-sm">
        <input placeholder="Legal name" class="input sm:col-span-2" [(ngModel)]="settings.legalName" />
        <input placeholder="Support email" class="input sm:col-span-2" [(ngModel)]="settings.supportEmail" />
        <textarea placeholder="Legal footer (PDF)" class="textarea sm:col-span-2" [(ngModel)]="settings.legalFooter"></textarea>
        <div class="sm:col-span-2">
          <div class="text-xs font-medium text-gray-700 mb-2">Logo</div>
          <div class="flex items-center gap-3">
            <input id="logoInput" type="file" accept="image/*" (change)="onLogoSelected($event)" class="hidden" />
            <label for="logoInput" class="relative h-14 w-14 rounded-xl border bg-white overflow-hidden cursor-pointer group flex items-center justify-center">
              <ng-container *ngIf="settings.logoDataUrl; else logoEmpty">
                <img [src]="settings.logoDataUrl!" alt="Company logo" class="absolute inset-0 h-full w-full object-cover" />
                <div class="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition-colors"></div>
                <div class="relative opacity-0 group-hover:opacity-100 transition-opacity text-white flex flex-col items-center text-[10px]">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 mb-0.5"><path d="M12 16a1 1 0 0 1-1-1V8.41l-2.3 2.3a1 1 0 1 1-1.4-1.42l4-4a1 1 0 0 1 1.4 0l4 4a1 1 0 1 1-1.4 1.42L13 8.4V15a1 1 0 0 1-1 1Z"/><path d="M5 20a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3h2a1 1 0 1 1 0 2H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1h-2a1 1 0 1 1 0-2h2a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5Z"/></svg>
                  <span>Change</span>
                </div>
              </ng-container>
              <ng-template #logoEmpty>
                <div class="absolute inset-0 bg-slate-100"></div>
                <div class="relative text-slate-600 flex flex-col items-center">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6"><path d="M12 16a1 1 0 0 1-1-1V8.41l-2.3 2.3a1 1 0 1 1-1.4-1.42l4-4a1 1 0 0 1 1.4 0l4 4a1 1 0 1 1-1.4 1.42L13 8.4V15a1 1 0 0 1-1 1Z"/><path d="M5 20a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3h2a1 1 0 1 1 0 2H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1h-2a1 1 0 1 1 0-2h2a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5Z"/></svg>
                </div>
              </ng-template>
            </label>
            <button class="btn-ghost" (click)="removeLogo()" [disabled]="!settings.logoDataUrl">Remove</button>
            <div class="text-xs text-gray-600">PNG/JPG/SVG up to 5MB.</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Display & formats</div>
      <div class="mt-3 grid sm:grid-cols-3 gap-3 text-sm">
        <select class="select" [(ngModel)]="settings.currency" (change)="saveSettings()">
          <option value="CAD">CAD</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
        </select>
        <select class="select" [(ngModel)]="settings.dateFormat" (change)="saveSettings()">
          <option value="YYYY‑MM‑DD">YYYY‑MM‑DD</option>
          <option value="DD/MM/YYYY">DD/MM/YYYY</option>
          <option value="MM/DD/YYYY">MM/DD/YYYY</option>
        </select>
        <select class="select" [(ngModel)]="settings.numberFormat" (change)="saveSettings()">
          <option value="1,234.56">1,234.56</option>
          <option value="1.234,56">1.234,56</option>
        </select>
      </div>
    </div>

    

    <div class="card">
      <div class="section-title">Invoice numbering</div>
      <div class="mt-3 grid sm:grid-cols-2 gap-3 text-sm">
        <input placeholder="Prefix (e.g., INV‑{YYYY}-)" class="input" [(ngModel)]="settings.invoiceNumberPrefix" (ngModelChange)="saveSettings()" />
        <input type="number" placeholder="Starting counter" class="input" [(ngModel)]="settings.invoiceNumberCounter" (ngModelChange)="saveSettings()" />
      </div>
    </div>

    
  </div>

  <!-- Preview Modal -->
  <div *ngIf="showPreview" class="fixed inset-0 bg-black/30 flex items-center justify-center p-4 z-50">
    <div class="w-full max-w-4xl card relative">
      <button (click)="closePreview()" class="absolute top-3 right-3 btn-ghost text-xs">Close</button>
      <app-invoice-preview [invoice]="previewInvoiceData!"></app-invoice-preview>
      </div>
  </div>
