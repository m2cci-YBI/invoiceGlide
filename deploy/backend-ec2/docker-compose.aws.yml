version: '3.9'

services:
  # Reverse proxy to expose the API on port 80
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - gateway
    networks:
      - invoice-net

  gateway:
    image: ${ECR_REPO_URI}:gateway-latest
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - invoice-net
    depends_on:
      - admin-service

  admin-service:
    image: ${ECR_REPO_URI}:admin-latest
    environment:
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL}
      - APP_BASE_URL=${APP_BASE_URL}
      - SEED_USER_EMAIL=${SEED_USER_EMAIL}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD}
      - SEED_USER_NAME=${SEED_USER_NAME}
      - MAILING_BASE_URL=${MAILING_BASE_URL}
    restart: unless-stopped
    expose:
      - "8081"
    networks:
      - invoice-net

  invoice-service:
    image: ${ECR_REPO_URI}:invoice-latest
    environment:
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_BASE_URL=http://admin-service:8081
      - SEED_USER_EMAIL=${SEED_USER_EMAIL}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD}
    restart: unless-stopped
    expose:
      - "8082"
    networks:
      - invoice-net
    depends_on:
      - admin-service

  mailing-service:
    image: ${ECR_REPO_URI}:mailing-latest
    environment:
      - MAILTRAP_API_TOKEN=${MAILTRAP_API_TOKEN}
      - SMTP_FROM=${SMTP_FROM}
      - INVOICE_API_BASE=${INVOICE_API_BASE}
      - APP_BASE_URL=${APP_BASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - ATTACH_PDF=${ATTACH_PDF}
      - MAILTRAP_API_URL=${MAILTRAP_API_URL}
    restart: unless-stopped
    expose:
      - "8083"
    networks:
      - invoice-net
    depends_on:
      - invoice-service

networks:
  invoice-net:
    driver: bridge

