server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=Cookie
      routes:
        - id: invoice-service
          uri: http://invoice-service:8082
          predicates:
            - Path=/api/invoice/**
          filters:
            - StripPrefix=0
        - id: admin-service
          uri: http://admin-service:8081
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=0
        - id: mailing-service
          uri: http://mailing-service:8083
          predicates:
            - Path=/api/mail/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Shared JWT secret for validating access tokens
security:
  jwt:
    secret: ${JWT_SECRET}

# Optional CORS configuration (enabled only if CORS_ALLOWED_ORIGINS provided)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
