server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: admin-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:seed.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  stripe:
    secret: ${STRIPE_SECRET}
  base-url: ${APP_BASE_URL}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL}
    refresh-ttl: ${JWT_REFRESH_TTL}
