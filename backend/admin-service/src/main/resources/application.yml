server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: admin-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  stripe:
    secret: ${STRIPE_SECRET}
  base-url: ${APP_BASE_URL}
  seed:
    user:
      email: ${SEED_USER_EMAIL}
      password: ${SEED_USER_PASSWORD}
      name: ${SEED_USER_NAME}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL}
    refresh-ttl: ${JWT_REFRESH_TTL}

