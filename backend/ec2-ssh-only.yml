AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 with SSH for WinSCP (Ohio), Docker/Compose installed, upload to /opt/invoiceglide.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: REQUIRED key pair name for SSH/WinSCP.
  SSHIngressCidr:
    Type: String
    Description: CIDR allowed to SSH (22). Prefer your_ip/32.
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64

Resources:
  VPC: { Type: AWS::EC2::VPC, Properties: { CidrBlock: 10.30.0.0/16, EnableDnsHostnames: true, EnableDnsSupport: true } }
  IGW: { Type: AWS::EC2::InternetGateway }
  AttachIgw: { Type: AWS::EC2::VPCGatewayAttachment, Properties: { VpcId: !Ref VPC, InternetGatewayId: !Ref IGW } }
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.30.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
  PublicRT: { Type: AWS::EC2::RouteTable, Properties: { VpcId: !Ref VPC } }
  PublicRoute: { Type: AWS::EC2::Route, Properties: { RouteTableId: !Ref PublicRT, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref IGW } }
  AssocPublic: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PublicSubnet, RouteTableId: !Ref PublicRT } }
  EC2SG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH (22) and HTTP (80)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SSHIngressCidr }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
      SecurityGroupEgress: [ { IpProtocol: -1, CidrIp: 0.0.0.0/0 } ]
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: "2012-10-17", Statement: [ { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole } ] }
      ManagedPolicyArns: [ arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore ]
  InstanceProfile: { Type: AWS::IAM::InstanceProfile, Properties: { Roles: [ !Ref InstanceRole ] } }
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [ !Ref EC2SG ]
      Tags: [ { Key: Name, Value: invoiceGlide-ec2 } ]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y docker docker-compose-plugin
          systemctl enable --now docker
          usermod -aG docker ec2-user
          mkdir -p /opt/invoiceglide
          chown -R ec2-user:ec2-user /opt/invoiceglide
Outputs:
  InstancePublicIp: { Description: EC2 public IPv4, Value: !GetAtt EC2Instance.PublicIp }
