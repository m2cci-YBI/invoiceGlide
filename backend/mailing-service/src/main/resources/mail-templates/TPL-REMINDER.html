<div style="margin:0;padding:0;background:#F3F4F6;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
               style="max-width:100%;background:#ffffff;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:24px 28px;border-bottom:1px solid #E5E7EB;">
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:600;color:#111827;">
                {company.name}
              </div>
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#6B7280;margin-top:4px;">
                {company.email}
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:600;color:#111827;">Friendly
                payment reminder
              </div>
              <p style="margin:12px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111827;">Hi
                {client.name},</p>
              <p style="margin:12px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111827;">This is
                a reminder for invoice {invoice.number}, due on {invoice.dueDate}.</p>
              <table role="presentation" width="100%" style="margin:16px 0;border-collapse:collapse;">
                <tr>
                  <td style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#6B7280;padding:6px 0;">Invoice
                    number
                  </td>
                  <td align="right"
                      style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111827;padding:6px 0;">
                    {invoice.number}
                  </td>
                </tr>
                <tr>
                  <td style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#6B7280;padding:6px 0;">Total
                  </td>
                  <td align="right"
                      style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111827;padding:6px 0;">
                    {invoice.total}
                  </td>
                </tr>
              </table>
              <div style="margin-top:8px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#6B7280;">
                Questions? Reply to this email.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
