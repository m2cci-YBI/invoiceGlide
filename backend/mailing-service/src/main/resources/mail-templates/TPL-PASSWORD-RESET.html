<div style="margin:0;padding:0;background:#F3F4F6;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
               style="max-width:100%;background:#ffffff;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:24px 28px;border-bottom:1px solid #E5E7EB;">
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:600;color:#111827;">{company.name}</div>
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#6B7280;margin-top:4px;">{company.email}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:600;color:#111827;">Reset your password</div>
              <p style="margin:12px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111827;">Hi {user.name},</p>
              <p style="margin:12px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111827;">We received a request to reset your password. Click the button below to set a new password.</p>
              <p style="margin:16px 0 0 0;"><a href="{action.url}" style="display:inline-block;background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-family:Arial,Helvetica,sans-serif;font-size:14px;text-decoration:none;">Reset password</a></p>
              <p style="margin:16px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#6B7280;">If you didn’t request this, you can safely ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
