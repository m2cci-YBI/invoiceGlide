AWSTemplateFormatVersion: '2010-09-09'
Description: ECS cluster, task definitions, services with Cloud Map and NLB target groups

Parameters:
  NetworkStackName:
    Type: String
  DataStackName:
    Type: String
  EcrStackName:
    Type: String
  CpuUnits:
    Type: Number
    Default: 512
  MemoryMiB:
    Type: Number
    Default: 1024
  AdminImageTag:
    Type: String
    Default: latest
  InvoiceImageTag:
    Type: String
    Default: latest
  MailingImageTag:
    Type: String
    Default: latest
  JwtSecretParam:
    Type: String
    Default: /invoice/jwt/secret
  MailtrapTokenParam:
    Type: String
    Default: /invoice/mailtrap/token
  AppBaseUrlParam:
    Type: String
    Default: /invoice/app/baseUrl

Resources:
  Cluster:
    Type: AWS::ECS::Cluster

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ssm-secrets-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: '*'

  AdminTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: !Ref CpuUnits
      Memory: !Ref MemoryMiB
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: admin
          Image: !Sub "${AdminRepo}:$${AdminImageTag}"
          PortMappings:
            - ContainerPort: 8081
              Protocol: tcp
          Environment:
            - Name: APP_BASE_URL
              Value: !Sub "{{resolve:ssm:${AppBaseUrlParam}}}"
            - Name: DB_URL
              Value: !Sub "jdbc:postgresql://${DbEndpoint}:5432/invoicedb"
            - Name: DB_USER
              Value: !Sub "{{resolve:secretsmanager:${DbSecretArn}::username}}"
          Secrets:
            - Name: DB_PASS
              ValueFrom: !Ref DbSecretArn
            - Name: JWT_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${JwtSecretParam}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${AWS::StackName}/admin"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  InvoiceTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: !Ref CpuUnits
      Memory: !Ref MemoryMiB
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: invoice
          Image: !Sub "${InvoiceRepo}:$${InvoiceImageTag}"
          PortMappings:
            - ContainerPort: 8082
              Protocol: tcp
          Environment:
            - Name: ADMIN_BASE_URL
              Value: !Sub "http://admin-service.${NamespaceName}:8081"
            - Name: DB_URL
              Value: !Sub "jdbc:postgresql://${DbEndpoint}:5432/invoicedb"
            - Name: DB_USER
              Value: !Sub "{{resolve:secretsmanager:${DbSecretArn}::username}}"
          Secrets:
            - Name: DB_PASS
              ValueFrom: !Ref DbSecretArn
            - Name: JWT_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${JwtSecretParam}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${AWS::StackName}/invoice"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  MailingTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: !Ref CpuUnits
      Memory: !Ref MemoryMiB
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: mailing
          Image: !Sub "${MailingRepo}:$${MailingImageTag}"
          PortMappings:
            - ContainerPort: 8083
              Protocol: tcp
          Environment:
            - Name: INVOICE_API_BASE
              Value: !Sub "http://invoice-service.${NamespaceName}:8082/api/invoice/v1"
            - Name: APP_BASE_URL
              Value: !Sub "{{resolve:ssm:${AppBaseUrlParam}}}"
            - Name: SMTP_FROM
              Value: invoices@invoiceglide.com
            - Name: DB_URL
              Value: !Sub "jdbc:postgresql://${DbEndpoint}:5432/invoicedb"
            - Name: DB_USER
              Value: !Sub "{{resolve:secretsmanager:${DbSecretArn}::username}}"
            - Name: ATTACH_PDF
              Value: 'true'
          Secrets:
            - Name: DB_PASS
              ValueFrom: !Ref DbSecretArn
            - Name: JWT_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${JwtSecretParam}"
            - Name: MAILTRAP_API_TOKEN
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MailtrapTokenParam}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${AWS::StackName}/mailing"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  LogsAdmin:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/admin"
      RetentionInDays: 14

  LogsInvoice:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/invoice"
      RetentionInDays: 14

  LogsMailing:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/mailing"
      RetentionInDays: 14

  AdminService:
    Type: AWS::ECS::Service
    DependsOn: LogsAdmin
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Split [",", { 'Fn::ImportValue': !Sub '${NetworkStackName}:PrivateAppSubnets' } ]
          SecurityGroups:
            - { 'Fn::ImportValue': !Sub '${NetworkStackName}:EcsSecurityGroupId' }
      ServiceRegistries:
        - RegistryArn: !GetAtt AdminSD.Arn
      LoadBalancers:
        - ContainerName: admin
          ContainerPort: 8081
          TargetGroupArn: { 'Fn::ImportValue': !Sub '${NetworkStackName}:TgaAdminArn' }
      TaskDefinition: !Ref AdminTaskDef

  InvoiceService:
    Type: AWS::ECS::Service
    DependsOn: LogsInvoice
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Split [",", { 'Fn::ImportValue': !Sub '${NetworkStackName}:PrivateAppSubnets' } ]
          SecurityGroups:
            - { 'Fn::ImportValue': !Sub '${NetworkStackName}:EcsSecurityGroupId' }
      ServiceRegistries:
        - RegistryArn: !GetAtt InvoiceSD.Arn
      LoadBalancers:
        - ContainerName: invoice
          ContainerPort: 8082
          TargetGroupArn: { 'Fn::ImportValue': !Sub '${NetworkStackName}:TgaInvoiceArn' }
      TaskDefinition: !Ref InvoiceTaskDef

  MailingService:
    Type: AWS::ECS::Service
    DependsOn: LogsMailing
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Split [",", { 'Fn::ImportValue': !Sub '${NetworkStackName}:PrivateAppSubnets' } ]
          SecurityGroups:
            - { 'Fn::ImportValue': !Sub '${NetworkStackName}:EcsSecurityGroupId' }
      ServiceRegistries:
        - RegistryArn: !GetAtt MailingSD.Arn
      LoadBalancers:
        - ContainerName: mailing
          ContainerPort: 8083
          TargetGroupArn: { 'Fn::ImportValue': !Sub '${NetworkStackName}:TgaMailingArn' }
      TaskDefinition: !Ref MailingTaskDef

  AdminSD:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: admin-service
      NamespaceId: { 'Fn::ImportValue': !Sub '${NetworkStackName}:NamespaceId' }
      DnsConfig:
        DnsRecords:
          - TTL: 5
            Type: A

  InvoiceSD:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: invoice-service
      NamespaceId: { 'Fn::ImportValue': !Sub '${NetworkStackName}:NamespaceId' }
      DnsConfig:
        DnsRecords:
          - TTL: 5
            Type: A

  MailingSD:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: mailing-service
      NamespaceId: { 'Fn::ImportValue': !Sub '${NetworkStackName}:NamespaceId' }
      DnsConfig:
        DnsRecords:
          - TTL: 5
            Type: A

Outputs:
  ClusterName:
    Value: !Ref Cluster
  NamespaceName:
    Value: { 'Fn::ImportValue': !Sub '${NetworkStackName}:NamespaceName' }
    Export:
      Name: !Sub "${AWS::StackName}:NamespaceName"
  DbEndpoint:
    Value: { 'Fn::ImportValue': !Sub '${DataStackName}:DbEndpoint' }
    Export:
      Name: !Sub "${AWS::StackName}:DbEndpoint"

# Helper imports via pseudo-outputs for !Sub usage
OutputsRefs:
  AdminRepo:
    Value: { 'Fn::ImportValue': !Sub '${EcrStackName}:AdminRepoUri' }
  InvoiceRepo:
    Value: { 'Fn::ImportValue': !Sub '${EcrStackName}:InvoiceRepoUri' }
  MailingRepo:
    Value: { 'Fn::ImportValue': !Sub '${EcrStackName}:MailingRepoUri' }
  DbEndpoint:
    Value: { 'Fn::ImportValue': !Sub '${DataStackName}:DbEndpoint' }
  DbSecretArn:
    Value: { 'Fn::ImportValue': !Sub '${DataStackName}:DbSecretArn' }
  NamespaceName:
    Value: { 'Fn::ImportValue': !Sub '${NetworkStackName}:NamespaceName' }

